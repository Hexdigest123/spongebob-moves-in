name: Build and Test

on:
  push:
    branches: [ "main", "development" ]

  pull_request:
    branches: [ "main", "development" ]

permissions:
  contents: read

jobs:
  test:
    name: Build and Test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        compiler: [gcc, clang]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install C build tools and raylib
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang make pkg-config libraylib-dev

      - name: Build with ${{ matrix.compiler }}
        run: |
          make clean || true
          make CC=${{ matrix.compiler }}

      - name: Run tests
        run: |
          make test

      - name: Build with warnings as errors
        run: |
          make clean || true
          make CC=${{ matrix.compiler }} CFLAGS="-Wall -Wextra -Werror"

      - name: Test with sanitizers
        run: |
          make clean || true
          make CC=${{ matrix.compiler }} CFLAGS="-fsanitize=address,undefined -g"
          make test
